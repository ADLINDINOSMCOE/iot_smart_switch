; PlatformIO Project Configuration File for ESP32 IoT Smart Switch
; Framework: Arduino
; Platform: espressif32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
